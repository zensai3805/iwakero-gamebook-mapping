name: AI Sub-Issue Implementation
description: AI最適化されたSub-Issue実装用
title: "[SUB-ISSUE] "
labels: ["type:sub-issue", "priority:medium"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## AI実装専用Sub-Issueテンプレート
        Claude Codeによる効率的な実装のために最適化されたSub-Issueテンプレートです。
        
        **重要**: Sub-Issue作成前に必ず以下を確認してください：
        - [ ] 親IssueのSPECIFICATION.md確認済み
        - [ ] DEVELOPMENT.md確認済み
        
  - type: input
    id: parent_issue
    attributes:
      label: "親Issue"
      description: "このSub-Issueの親Issue番号"
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: "概要"
      description: "このSub-Issueで実装する具体的な機能・タスク"
      placeholder: "親Issueの中で、このSub-Issueが担当する具体的な範囲を記載"
    validations:
      required: true

  - type: textarea
    id: implementation_scope
    attributes:
      label: "実装範囲"
      description: "このSub-Issueで実装する具体的な範囲"
      placeholder: |
        ## 実装対象ファイル
        - `cmd/gamebook/example.go`
        - `internal/domain/example.go`
        - `internal/domain/example_test.go`
        
        ## 実装対象機能
        - 関数: `ExampleFunction()`
        - 構造体: `ExampleStruct`
        - インターフェース: `ExampleInterface`
        
        ## 実装しないもの（範囲外）
        - UI層の実装
        - 他のドメインとの連携
      render: markdown
    validations:
      required: true

  - type: checkboxes
    id: implementation_tasks
    attributes:
      label: "実装タスク"
      description: "このSub-Issueで実行するタスク"
      options:
        - label: "テストケース設計"
          required: true
        - label: "テストコード実装（RED）"
          required: true
        - label: "最小限の実装（GREEN）"
          required: true
        - label: "リファクタリング（REFACTOR）"
          required: true
        - label: "エラーハンドリング実装"
          required: true
        - label: "日本語コメント追加"
          required: true
        - label: "統合テスト実行"
          required: true
        - label: "品質チェック実行"
          required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "受入条件"
      description: "このSub-Issueが完了したと判断する条件"
      placeholder: |
        ## 機能要件
        - [ ] 指定された入力に対して正しい出力が得られる
        - [ ] エラーケースで適切なエラーが返される
        - [ ] 既存機能に影響しない
        
        ## 品質要件
        - [ ] 単体テストが全て通過
        - [ ] テストカバレッジが新規コードで100%
        - [ ] リンターエラーなし
        - [ ] 変数shadowingなし
        
        ## 統合要件
        - [ ] 親Issueのタスクリストが更新される
        - [ ] 他のSub-Issueとの整合性確認
      render: markdown
    validations:
      required: true

  - type: textarea
    id: implementation_notes
    attributes:
      label: "実装メモ"
      description: "実装時に注意すべき点や参考情報"
      placeholder: |
        ## 技術的注意点
        - 変数shadowing（特にerr変数）に注意
        - エラーラッピングには%wを使用
        - 並行安全性が必要な場合はmutex使用
        
        ## 参考情報
        - 類似実装: `internal/domain/existing.go`
        - 設計パターン: Repository Pattern
        - テスト例: `internal/domain/existing_test.go`
        
        ## 依存関係
        - 前提条件: #123 の完了
        - 影響: #456 の実装に影響
      render: markdown
    validations:
      required: false

  - type: textarea
    id: ai_specific_instructions
    attributes:
      label: "AI実装指示"
      description: "Claude Code向けの具体的な実装指示"
      placeholder: |
        ## 実装手順
        1. テストファイル作成（`*_test.go`）
        2. 失敗するテストケース実装（RED）
        3. 最小限の実装で通るようにする（GREEN）
        4. コードをリファクタリング（REFACTOR）
        5. エラーハンドリング追加
        6. 日本語コメント追加
        7. 統合テスト実行
        
        ## コーディング規約
        - 絵文字使用禁止
        - 日本語コメント必須
        - エラーは`fmt.Errorf("説明: %w", err)`でラップ
        - 変数shadowing回避のため明示的命名
        - 関数は50行以内、複雑度20以下
        
        ## テスト方針
        - 正常系・異常系両方のテストケース
        - エッジケースも含める
        - モックが必要な場合は適切に使用
        
        ## 品質基準
        - `go test ./...` でエラーなし
        - `golangci-lint run` でエラーなし
        - カバレッジ100%（新規コード）
      render: markdown
    validations:
      required: true

  - type: checkboxes
    id: completion_checklist
    attributes:
      label: "完了チェックリスト"
      description: "Sub-Issue完了前に確認すべき項目"
      options:
        - label: "TDDサイクル（RED→GREEN→REFACTOR）完了"
          required: true
        - label: "単体テストが全て通過"
          required: true
        - label: "統合テストが通過"
          required: true
        - label: "リンターエラーなし"
          required: true
        - label: "変数shadowing回避"
          required: true
        - label: "エラーハンドリング適切実装"
          required: true
        - label: "日本語コメント追加"
          required: true
        - label: "親Issueのタスクリスト更新"
          required: true
        - label: "依存関係確認"
          required: true

  - type: textarea
    id: done_definition
    attributes:
      label: "完了定義"
      description: "このSub-Issueがいつ完了したと判断するか"
      placeholder: |
        ## 完了条件
        - [ ] 実装が完了し、全てのテストが通過
        - [ ] 品質チェックが通過
        - [ ] 親Issueのタスクが更新済み
        - [ ] 他のSub-Issueとの整合性確認済み
        
        ## 完了報告
        - 親Issue（#123）にコメントで完了報告
        - 実装内容の簡単な説明
        - 次のSub-Issueへの引き継ぎ事項があれば記載
      render: markdown
    validations:
      required: true