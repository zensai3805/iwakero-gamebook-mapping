name: AI Bug Report
description: AI最適化されたバグ報告用
title: "[BUG] "
labels: ["type:bug", "priority:high"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## AI実装専用バグレポートテンプレート
        Claude Codeによる効率的なバグ修正のために最適化されたバグレポートテンプレートです。
        
        **重要**: バグ報告前に必ず以下を確認してください：
        - [ ] 最新のmainブランチでも再現するか確認
        - [ ] 既存のIssueで同様のバグが報告されていないか確認
        
  - type: textarea
    id: bug_description
    attributes:
      label: "バグの概要"
      description: "発生しているバグの概要を簡潔に記載"
      placeholder: "何が期待される動作で、実際には何が起こっているかを記載"
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "再現手順"
      description: "バグを再現するための具体的な手順"
      placeholder: |
        1. アプリケーションを起動
        2. コマンド `./gamebook new "テストゲーム"` を実行
        3. コマンド `./gamebook add 1 "テスト"` を実行
        4. エラーが発生
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "期待される動作"
      description: "本来どのような動作をするべきか"
      placeholder: "正常に動作する場合、どのような結果になるべきかを記載"
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: "実際の動作"
      description: "実際に起こっている動作"
      placeholder: "エラーメッセージ、異常な出力、クラッシュなど具体的に記載"
    validations:
      required: true

  - type: textarea
    id: error_messages
    attributes:
      label: "エラーメッセージ"
      description: "発生したエラーメッセージやスタックトレース"
      placeholder: |
        ```
        エラーメッセージをここに貼り付け
        ```
      render: markdown
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: "環境情報"
      description: "バグが発生した環境の詳細"
      placeholder: |
        - OS: Ubuntu 22.04 / Windows 11 / macOS 13.0
        - Go version: `go version`の出力
        - アプリケーションバージョン: v0.2.0
        - 実行方法: インタラクティブモード / CLIモード
        - 使用しているターミナル: bash / zsh / PowerShell
      render: markdown
    validations:
      required: true

  - type: textarea
    id: related_files
    attributes:
      label: "関連ファイル"
      description: "バグに関連すると思われるファイル"
      placeholder: |
        ## 推定される関連ファイル
        - `cmd/gamebook/main.go`
        - `internal/domain/gamebook.go`
        - `internal/infrastructure/repository/markdown_repository.go`
        
        ## 設定ファイル
        - `data/.current_game`
        - `data/GameName.md`
        
        ## ログファイル
        - なし
      render: markdown
    validations:
      required: false

  - type: textarea
    id: ai_debug_info
    attributes:
      label: "AI向けデバッグ情報"
      description: "Claude Codeがバグを特定・修正しやすくするための情報"
      placeholder: |
        ## 推定される原因
        - エラーハンドリングの不備
        - 変数shadowingの問題
        - 並行処理の問題
        - ファイル操作の問題
        - nil pointer dereferenceの可能性
        
        ## 調査対象
        - [ ] エラーハンドリングの確認
        - [ ] 変数shadowingの確認
        - [ ] nil checkの確認
        - [ ] ファイル操作の確認
        - [ ] 並行安全性の確認
        
        ## 実行時の状態
        - メモリ使用量: 
        - CPU使用率: 
        - ファイル状態: 
        - 並行処理: 
      render: markdown
    validations:
      required: false

  - type: checkboxes
    id: debugging_checklist
    attributes:
      label: "デバッグチェックリスト"
      description: "バグ調査時に確認すべき項目"
      options:
        - label: "最新のmainブランチで再現確認"
          required: true
        - label: "ログファイルの確認"
          required: false
        - label: "テストケースでの再現確認"
          required: false
        - label: "最小限の再現コード作成"
          required: false
        - label: "依存関係の確認"
          required: false
        - label: "環境固有の問題か確認"
          required: false

  - type: textarea
    id: fix_approach
    attributes:
      label: "修正アプローチ"
      description: "バグ修正のためのアプローチ案"
      placeholder: |
        ## 修正方針
        1. 問題の原因特定
        2. 修正方法の検討
        3. 既存テストの確認
        4. 修正の実装
        5. テストケースの追加
        6. 回帰テストの実行
        
        ## 考慮事項
        - 他機能への影響
        - 後方互換性
        - パフォーマンスへの影響
        - 設定ファイルの移行
        
        ## テスト方針
        - バグ再現テストの追加
        - 回帰テストの実行
        - 統合テストの実行
      render: markdown
    validations:
      required: false

  - type: textarea
    id: ai_fix_instructions
    attributes:
      label: "AI修正指示"
      description: "Claude Code向けの具体的な修正指示"
      placeholder: |
        ## 修正手順
        1. 問題箇所の特定（関連ファイルの確認）
        2. バグ再現テストの作成
        3. 修正の実装
        4. テストの確認
        5. 品質チェック実行
        6. 回帰テストの実行
        
        ## 修正時の注意点
        - 既存の動作に影響しないよう注意
        - エラーハンドリングを適切に実装
        - 変数shadowing回避
        - 日本語コメントで修正理由を記載
        - 絵文字使用禁止
        
        ## 品質基準
        - バグ再現テストが追加されている
        - 全てのテストが通過
        - リンターエラーなし
        - カバレッジ低下なし
        
        ## 完了条件
        - バグが修正され、再現しない
        - 新しいテストケースが追加
        - 既存機能に影響しない
        - 品質チェックが通過
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "優先度"
      description: "このバグの修正優先度"
      options:
        - "critical - アプリケーションがクラッシュする"
        - "high - 主要機能が使用できない"
        - "medium - 一部機能に問題がある"
        - "low - 軽微な問題"
      default: 1
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "影響範囲"
      description: "このバグが影響する範囲"
      options:
        - "all - 全てのユーザー・環境に影響"
        - "specific - 特定の環境・条件でのみ発生"
        - "edge - エッジケースでのみ発生"
        - "unknown - 影響範囲不明"
      default: 3
    validations:
      required: true