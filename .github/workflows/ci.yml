name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
    
    - name: Verify dependencies
      run: |
        go mod verify
        go mod tidy
        git diff --exit-code
    
    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not properly formatted:"
          gofmt -s -l .
          exit 1
        fi
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run tests with coverage
      run: |
        # 全パッケージのテストを1回で実行し、同時にカバレッジも取得
        go test -v -race -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Check test coverage
      run: |
        # 全体のカバレッジを表示
        TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${TOTAL_COVERAGE}%"
        
        # 内部パッケージのみのカバレッジを計算（コアビジネスロジックの品質保証）
        INTERNAL_COVERAGE=$(go tool cover -func=coverage.out | grep "internal/" | awk '{sum+=$3; count++} END {if(count>0) print sum/count; else print 0}')
        echo "Internal packages coverage: ${INTERNAL_COVERAGE}%"
        
        # 内部パッケージのカバレッジしきい値チェック
        INTERNAL_INT=${INTERNAL_COVERAGE%.*}
        if [ "$INTERNAL_INT" -lt 70 ]; then
          echo "Internal packages coverage is below 70%"
          exit 1
        fi
    
    - name: Verify application can build
      run: go build -v ./cmd/gamebook && rm -f gamebook
    
    - name: Upload coverage reports
      if: matrix.go-version == '1.23'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        # Lintは最新安定版（1.23）で実行（各Goバージョンでのlint実行は不要）
        go-version: '1.23'
        cache: true
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m