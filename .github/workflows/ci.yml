name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
    
    - name: Verify dependencies
      run: |
        go mod verify
        go mod tidy
        git diff --exit-code
    
    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not properly formatted:"
          gofmt -s -l .
          exit 1
        fi
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run all tests
      run: |
        # 全パッケージのテストを実行（カバレッジ測定は別途）
        go test -v -race ./...
    
    - name: Run tests with coverage
      run: |
        # コアビジネスロジックのカバレッジを測定（CLIは統合テストで別途検証）
        go test -v -race -coverprofile=coverage.out ./internal/...
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Check test coverage
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Test coverage: ${COVERAGE}%"
        # Convert to integer for comparison (remove decimal part)
        COVERAGE_INT=${COVERAGE%.*}
        if [ "$COVERAGE_INT" -lt 70 ]; then
          echo "Test coverage is below 70%"
          exit 1
        fi
    
    - name: Build application
      run: go build -v ./cmd/gamebook
    
    - name: Upload coverage reports
      if: matrix.go-version == '1.23'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        # Lintは最新安定版（1.23）で実行（各Goバージョンでのlint実行は不要）
        go-version: '1.23'
        cache: true
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m