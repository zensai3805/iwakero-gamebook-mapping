name: Build and Commit Binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Commit Binary
    runs-on: ubuntu-latest
    # mainブランチへのpushでのみ実行
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
        cache: true
    
    - name: Build binary
      run: |
        go build -o gamebook ./cmd/gamebook
        echo "Binary built successfully"
        ls -la gamebook
    
    - name: Check for binary changes
      id: check_changes
      run: |
        # バイナリが既に存在し、変更がない場合はスキップ
        if git diff --quiet HEAD^ HEAD -- go.mod go.sum cmd/ internal/ && [ -f gamebook ]; then
          echo "No source changes detected, skipping binary update"
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "Source changes detected or binary missing, updating binary"
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit binary
      if: steps.check_changes.outputs.skip == 'false'
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # .gitignoreからgamebookを一時的に除外してコミット
        git add -f gamebook
        
        if git diff --staged --quiet; then
          echo "No binary changes to commit"
        else
          git commit -m "🤖 Auto-build: Update binary from latest main

Built from commit: ${{ github.sha }}
Workflow: ${{ github.workflow }}

Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          
          git push
          echo "Binary committed and pushed successfully"
        fi
    
    - name: Verify binary functionality
      run: |
        ./gamebook --help
        echo "Binary verification completed"